<main class="grid gap-4">
  <section class="rounded-xl border bg-card p-8 text-card-foreground shadow-xs">
    <div class="flex items-center justify-between gap-2">
      <div>
        <h1 class="text-xl font-semibold">Gestión de Lotes</h1>
        <p class="pt-1 text-sm text-muted-foreground">Listado de lotes de materiales y productos terminados registrados.</p>
      </div>
      <a routerLink="/batches/new" class="inline-flex h-10 items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground ring-offset-background transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50">
        Nuevo Lote
      </a>
    </div>

    @if (errorMessage()) {
      <p class="mt-3 rounded-md border border-destructive/40 bg-destructive/5 px-3 py-2 text-sm text-destructive">
        {{ errorMessage() }}
      </p>
    }

    <div class="mt-4">
      <app-custom-table
        [columns]="tableColumns()"
        [rows]="batches()"
        [loading]="loading()"
        [pageSize]="25"
        [skeletonRows]="10"
        [emptyMessage]="'No hay lotes registrados.'"
        (edit)="editBatch($event)"
        (delete)="deleteBatch($event)"
      />
    </div>
  </section>
</main>
