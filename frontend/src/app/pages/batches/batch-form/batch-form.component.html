<main class="grid gap-4">
  <section class="rounded-xl border bg-card p-8 text-card-foreground shadow-xs">
    <div class="flex items-center justify-between gap-2">
      <div>
        <h1 class="text-xl font-semibold">Registrar Nuevo Lote</h1>
        <p class="pt-1 text-sm text-muted-foreground">Formulario para el registro de lotes de materiales y productos.</p>
      </div>
    </div>

    @if (errorMessage()) {
      <p class="mt-3 rounded-md border border-destructive/40 bg-destructive/5 px-3 py-2 text-sm text-destructive">
        {{ errorMessage() }}
      </p>
    }

    <div class="mt-4">
      <form [formGroup]="batchForm" (ngSubmit)="onSubmit()" class="grid gap-4">
        
        <div>
          <label class="mb-1 block text-sm font-medium" for="enterpriseId">Empresa</label>
          <select formControlName="enterpriseId" id="enterpriseId"
            class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
            <option value="">Seleccione una empresa...</option>
            @for (enterprise of enterprises(); track enterprise.id) {
              <option [value]="enterprise.id">{{ enterprise.name }}</option>
            }
          </select>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium" for="batchType">Tipo de Lote</label>
          <select formControlName="batchType" id="batchType"
            class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
            <option value="MATERIAL">Material</option>
            <option value="PRODUCT">Producto Terminado</option>
          </select>
        </div>

        @if (batchForm.get('batchType')?.value === 'MATERIAL') {
          <div>
            <label class="mb-1 block text-sm font-medium" for="materialId">Material (ID o Referencia)</label>
            <input formControlName="materialId" id="materialId" type="text"
              class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
              placeholder="UUID del material">
          </div>
        }

        @if (batchForm.get('batchType')?.value === 'PRODUCT') {
          <div>
            <label class="mb-1 block text-sm font-medium" for="productId">Producto (ID o Referencia)</label>
            <input formControlName="productId" id="productId" type="text"
              class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
              placeholder="UUID del producto">
          </div>
        }

        <div>
          <label class="mb-1 block text-sm font-medium" for="status">Estado de Calidad</label>
          <select formControlName="status" id="status"
            class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
            <option value="APPROVED">Aprobado</option>
            <option value="QUALITY_BLOCKED">Bloqueado por Calidad</option>
            <option value="QUARANTINE">Cuarentena</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="mb-1 block text-sm font-medium" for="productionDate">Fecha de Producción</label>
            <input formControlName="productionDate" id="productionDate" type="date"
              class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
          </div>

          <div>
            <label class="mb-1 block text-sm font-medium" for="expirationDate">Fecha de Vencimiento</label>
            <input formControlName="expirationDate" id="expirationDate" type="date"
              class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
          </div>
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium" for="currentStock">Stock Inicial</label>
          <input formControlName="currentStock" id="currentStock" type="number" step="0.01" min="0"
            class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
        </div>

        <div class="mt-4 flex items-center gap-2">
          <button type="submit" [disabled]="batchForm.invalid || loading()"
            class="inline-flex h-10 items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground ring-offset-background transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50">
            @if (loading()) {
              Guardando...
            } @else {
              Guardar Lote
            }
          </button>
          <button type="button" (click)="cancel()" [disabled]="loading()"
            class="inline-flex h-10 items-center justify-center rounded-md border border-input bg-transparent px-4 py-2 text-sm font-medium ring-offset-background transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50">
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </section>
</main>
